[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "i686-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]
all-features = false

[advisories]
version = 2
yanked = "deny"

# Every entry here is a crate Taarib does not choose. Each names who pulls it
# in and what would have to change for the entry to go away. Nothing is ignored
# because it was noisy.
ignore = [
    # GTK3 through Tauri's Linux tray and window stack: tauri -> tray-icon ->
    # libappindicator -> gtk 0.18, and tauri -> gtk. gtk-rs has moved to GTK4;
    # Tauri 2 has not. These are unmaintained, not vulnerable, and they leave
    # the graph when Tauri's Linux backend does — not before.
    { id = "RUSTSEC-2024-0411", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0412", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0413", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0414", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0415", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0416", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0417", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0418", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0419", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },
    { id = "RUSTSEC-2024-0420", reason = "gtk via tauri/tray-icon; Tauri 2 has no GTK4 backend" },

    # proc-macro-error is a build-time macro helper inside glib-macros, which
    # arrives with the same GTK3 stack. It runs on the build machine and ships
    # nothing.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros; build-time only" },

    # paste is a build-time macro helper inside specta, which generates the
    # Studio's TypeScript bindings. Also build-time; nothing of it is linked.
    { id = "RUSTSEC-2024-0436", reason = "paste via specta; build-time only" },

    # The unic-* set arrives through urlpattern, which tauri-utils uses to parse
    # capability URL patterns. Unmaintained Unicode tables, not a vulnerability;
    # they leave when Tauri replaces urlpattern.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range via urlpattern <- tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common via urlpattern <- tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property via urlpattern <- tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version via urlpattern <- tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident via urlpattern <- tauri-utils" },
]

[licenses]
version = 2
# Taarib ships inside other people's processes and is redistributed by users.
# Only licenses that survive that are allowed.
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # rustls's root store. A permissive data licence for the Mozilla CA set,
    # not code: redistribution is unrestricted and no notice travels with a
    # binary. Allowed at the top level rather than as an exception because any
    # crate carrying certificate data would be judged the same way.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

# `libbz2-rs-sys` is a Rust reimplementation of libbz2 carrying the original
# bzip2 licence, which is a two-clause BSD with a no-misrepresentation term. It
# is permissive and redistribution-safe, but it is one crate's licence rather
# than a class Taarib means to allow generally, so it is named as an exception
# and not added to the list above.
[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Every intra-workspace dependency is `{ workspace = true }` against a path, and
# cargo-deny reads a path dependency's version requirement as `*`. Denying those
# would flag all twenty-seven crates for depending on each other. Wildcards on
# anything published stay denied.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Decision 3 and Decision 4 are enforceable here: two copies of read-fonts in
# the graph would mean the shaper and the rasterizer could parse a font
# differently, which is exactly the failure the choice of skrifa exists to make
# impossible. This is checked, not assumed.
[[bans.deny]]
crate = "read-fonts"
deny-multiple-versions = true

[[bans.deny]]
crate = "harfbuzz-sys"
reason = "Decision 2: the shaper is HarfRust. A native HarfBuzz must never enter the graph."

[[bans.deny]]
crate = "rustybuzz"
reason = "Decision 2: the shaper is HarfRust, not rustybuzz."

[[bans.deny]]
crate = "harfbuzz_rs"
reason = "Decision 2: no binding to native HarfBuzz."

# rustls is the TLS stack for everything Taarib itself speaks. libgit2 is the
# one exception and it is a deliberate one: the submission flow fetches and
# pushes over HTTPS through `git2`, libgit2 has no rustls backend, and the
# alternative — linking whatever OpenSSL the build host happens to carry —
# is worse across nine targets than vendoring a known one. So `openssl-sys`
# is expected in the graph, arriving only through `git2 -> libgit2-sys` with
# `vendored-openssl`, and `assets/NOTICES.md` carries its notice.
#
# What stays banned is the safe wrapper and `native-tls`: nothing here should
# be calling OpenSSL from Rust, and `native-tls` would pull a *second*,
# system-linked copy in behind an HTTP client's back.
[[bans.deny]]
crate = "openssl"
reason = "No Rust code here calls OpenSSL; libgit2 links it directly or not at all."

[[bans.deny]]
crate = "native-tls"
reason = "Would link a second, system OpenSSL behind an HTTP client; rustls is the stack."

# Native code and interpreted scripts shipped inside a crate's own sources are
# flagged for review. Build scripts themselves are not restricted: the font,
# compression, SQLite and TLS stacks all legitimately have them, and an
# allow-list here would be a wall of noise nobody reads rather than a control.
#
# What is bypassed below is reviewed, not waived. Each entry is a crate whose
# published sources carry files cargo-deny recognises as executable, with the
# count that was reviewed. A crate that grows another one fails this check
# again, which is the point of pinning the count rather than the crate.
[bans.build]
executables = "deny"
interpreted = "deny"
script-extensions = ["py", "sh", "bash", "ps1", "bat", "cmd"]

# ring vendors the assembly and C sources for its primitives, pre-generated per
# target, plus the perlasm generators that produced them. This is how ring has
# always shipped; the files are inputs to its build script, not programs run at
# install time.
[[bans.build.bypass]]
crate = "ring"
allow-globs = ["crypto/**", "pregenerated/**", "third_party/**", "*.sh", "mk/**"]

# libgit2-sys vendors libgit2's C tree, including its CMake and shell helpers.
[[bans.build.bypass]]
crate = "libgit2-sys"
allow-globs = ["libgit2/**", "*.sh"]

# zerocopy ships its CI shell scripts inside the published crate. They run in
# zerocopy's own CI and are never invoked by a consumer's build.
[[bans.build.bypass]]
crate = "zerocopy"
allow-globs = ["ci/**", "cargo.sh", "win-cargo.bat"]

# blake3 vendors per-architecture assembly for its SIMD backends, selected by
# its build script.
[[bans.build.bypass]]
crate = "blake3"
allow-globs = ["c/**", "*.S", "*.asm", ".github/**"]

# webview2-com-sys ships Microsoft's redistributable WebView2 loader for the
# three Windows architectures. It is the loader Tauri links against on Windows
# and is signed by Microsoft; there is no source-only form of it.
[[bans.build.bypass]]
crate = "webview2-com-sys"
allow-globs = ["arm64/**", "x64/**", "x86/**"]

# libdbus-sys vendors D-Bus's configure helpers for the Linux build.
[[bans.build.bypass]]
crate = "libdbus-sys"
allow-globs = ["**/*.sh", "vendor/**"]

# curve25519-dalek, cookie, libc and target-lexicon each ship a single helper
# script beside their sources — a benchmark runner or a codegen helper — none of
# which their build scripts call.
[[bans.build.bypass]]
crate = "curve25519-dalek"
allow-globs = ["**/*.sh"]

[[bans.build.bypass]]
crate = "cookie"
allow-globs = ["**/*.sh"]

[[bans.build.bypass]]
crate = "libc"
allow-globs = ["**/*.sh", "etc/**"]

[[bans.build.bypass]]
crate = "target-lexicon"
allow-globs = ["**/*.sh"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
