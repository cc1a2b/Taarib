[package]
name = "taarib-tathbeet"
description = "تثبيت تعريب — installation, rollback and update survival: framework installation per engine and platform, the manifest of every change, exact restore, and integrity verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
taarib-usus = { workspace = true }
taarib-mustalahat = { workspace = true }
taarib-ruqaa = { workspace = true }
taarib-tarqee = { workspace = true }
taarib-aman = { workspace = true }
taarib-kashf = { workspace = true }
taarib-khatm = { workspace = true }
# The four script engines whose translations are written into the game's own
# data rather than injected into its process. This crate owns the install
# pipeline and is therefore the only place that can call them at the moment the
# manifest is durable and the game is proven not to be running; `nusus` is the
# single dispatch point and nothing else here reaches into that crate.
taarib-muhawwil-nusus = { workspace = true }
# The Unreal container. The deployment step builds the additive `.pak` the
# engine mounts — the game's own `.locres` rewritten with the package's Arabic
# and the face beside them — through the adapter's own assembler, and writes it
# through this crate's recorder so an uninstall deletes it.
taarib-muhawwil-unreal = { workspace = true }
# The one question the framework table cannot ask about an Unreal game: whether
# its shipping executable imports the module Taarib's proxy stands in for. Read
# off the import table, mapped rather than read, because a shipping executable
# is a hundred megabytes and the answer is in its first few.
object = { workspace = true }
memmap2 = { workspace = true }

# The fingerprints the whole reversibility contract rests on. Every original is
# hashed before it is preserved and every restore is verified against that hash,
# so this crate computes BLAKE3 itself rather than taking a digest on trust from
# whoever handed it a file.
blake3 = { workspace = true }
# Backups are stored compressed; the recorded fingerprint is of the plaintext, so
# nothing about verification depends on which release of this library is linked.
zstd = { workspace = true }
# The component catalogue is vouched for by a sha256 the staging manifest
# carries, and `bayan_makhzan` proves that hash before it parses a byte of the
# catalogue. BLAKE3 above is the install pipeline's own fingerprint; this one is
# not a choice — it is the digest `taarib-tajmee` and `bayan_mukawwinat.json`
# already speak, and a second algorithm here would mean re-hashing the release.
sha2 = { workspace = true }
# The digest a third-party pin is expressed in is hex on the registry row and in
# the author's own announcement, so the comparison is made in hex rather than by
# parsing the pin into bytes: what a maintainer can check by eye is the string.
hex = { workspace = true }
# Third-party patches ship as zip archives. Read-only here, and every entry is
# checked against the game root and the entry's declared layout before a byte of
# it is expanded — the reader is a parser, never an extractor.
zip = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The dispatch proof builds a real package and a real game directory and runs
# the install step over both; nothing about it is mocked.
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
