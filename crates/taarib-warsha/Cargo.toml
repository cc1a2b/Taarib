[package]
name = "taarib-warsha"
description = "ورشة تعريب — the collaborative workspace: a portable project bundle, assignment and soft locking, three-way merge by string identity, per-string history, interchange formats and contribution statistics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
taarib-usus = { workspace = true }
taarib-mustalahat = { workspace = true }
taarib-tarjama = { workspace = true }
taarib-makhzan = { workspace = true }
# The project store this phase shares and merges; defining a second one here is
# exactly what the phase refuses.
taarib-istikhraj = { workspace = true }
# Phase 14's importers, which every export must round-trip through.
taarib-tarqee = { workspace = true }
# Phase 18's comment model, reused rather than duplicated.
taarib-taqdeem = { workspace = true }
# Ed25519 for the memory share's header. Named directly rather than reached
# through `taarib-taqdeem`, which does not re-export it: a share is signed by
# a contributor's own key and never by the owner's, so it uses the signing
# primitives without touching the publishing authority that crate guards.
taarib-khatm = { workspace = true }

rusqlite = { workspace = true }
quick-xml = { workspace = true }
blake3 = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The sharing proof opens two real memory files in two real directories and
# moves a real signed file between them; nothing about it is mocked, and the
# translator it drives is a local stub that counts its own calls.
tempfile = { workspace = true }
