# cbindgen configuration for taarib-jisr.
#
# `include/taarib.h` is generated from this file and the crate's public surface
# by `build.rs`, then committed, so a consumer binds against the ABI without a
# Rust toolchain. The header is a build product: it is never hand-edited, and a
# mismatch is fixed in the Rust and regenerated, never patched in the C.

language = "C"
cpp_compat = true

include_guard = "TAARIB_H"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]

# `usize`/`isize` cross as `size_t`/`ptrdiff_t`, which is what every marshalling
# layer on the other side (`UIntPtr`, ctypes `c_size_t`, Ruby `size_t`) already
# assumes for a length or a capacity.
usize_is_size_t = true

# Structures come out as `typedef struct { ... } TaaribHarf;` so C callers name
# them exactly as the documentation does, without the `struct` keyword.
style = "type"

header = """/* تعريب — taarib.h
 *
 * The stable C ABI of the Taarib Arabic text engine (crates/taarib-jisr).
 *
 * GENERATED FILE — DO NOT EDIT BY HAND. cbindgen produces this header from the
 * Rust surface on every build; any change made here is destroyed by the next
 * one. Fix the Rust, regenerate, commit both.
 *
 * Every function returns an int32_t status: zero is success, every failure is
 * negative, and the failing thread's full diagnosis — permanent code, Arabic
 * sentence, English sentence, suggested next action — is retrievable through
 * the taarib_khata_* functions. Ownership is stated per function in its
 * comment: who allocates, who frees, and how long a returned pointer stays
 * valid. The same contract, in longer form, is docs/abi.md. */"""

autogen_warning = "/* Generated by cbindgen from taarib-jisr. Do not hand-edit; regenerate instead. */"
include_version = true

# The documentation comments are the ownership contract, so they travel into
# the header whole rather than trimmed.
documentation = true
documentation_style = "c"
documentation_length = "full"

tab_width = 2
line_length = 100

[fn]
args = "auto"

[export]
# Every exported item already carries its permanent name — `Taarib*` for types,
# `TAARIB_*` for constants, `taarib_*` for functions. Nothing is renamed,
# prefixed or mangled on the way through.

[parse]
parse_deps = false
