[package]
name = "taarib-tahdith"
description = "تحديث تعريب — application self-update: a signed channel manifest verified by the same anchor as patches, resumable verified downloads, and a swap that leaves the previous version launchable if it is interrupted."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
# The cast is exercised against a real registry directory on a real filesystem:
# a first cast into an empty one, a second cast that must leave the other
# channel standing, and a manifest signed by another key that must not be merged
# into. All three are about files, and none of them is provable in memory.
tempfile = { workspace = true }

[dependencies]
taarib-usus = { workspace = true }
taarib-khatm = { workspace = true }

hex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
