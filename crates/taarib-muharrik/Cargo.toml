[package]
name = "taarib-muharrik"
description = "محرّك تعريب — engine identification and the capability probe: evidence, resolution, the capability report a player can read, and the persisted per-game record."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
taarib-usus = { workspace = true }
taarib-mustalahat = { workspace = true }
taarib-makhzan = { workspace = true }
# Phase 4 → Phase 5 in the dependency graph. The capability report has to
# account for what the launcher already knows and nothing on disk says: a VAC
# association, an anti-cheat service named in a manifest, a compatibility layer.
# Those arrive as `SimatLuba`, which is discovery's vocabulary.
taarib-kashf = { workspace = true }

object = { workspace = true }
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The BIO4 detector is the one detector in this crate that has to be given a
# directory rather than a byte slice: its answer degrades from a container magic
# to a directory shape, and the degradation is the part worth pinning. The
# fixtures are real header bytes laid out in a real tree.
tempfile = { workspace = true }
# Tests only, and it is the overlay depending on this crate's vocabulary that is
# the real direction — Phase 5 identifies a game, Phase 14 draws over it, and a
# probe that linked the overlay would be a probe that could load a renderer.
#
# `tests/mufradat_rusum.rs` needs both enumerations in one compilation unit to
# hold the rule that binds them: every graphics backend the overlay ships must
# have a value here and an import signature that produces it. Three backends
# were built without either, and the games that use them reported no graphics
# API at all. Asserting it from a list copied into this crate would be asserting
# against the copy.
taarib-tabaqa = { workspace = true }
