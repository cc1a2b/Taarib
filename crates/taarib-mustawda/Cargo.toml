[package]
name = "taarib-mustawda"
description = "مستودع تعريب — the registry client: the global manifest, sharded index fetching, three-tier build matching, resumable downloads with mirror failover, ranking, ratings and full offline sources."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Derive specta::Type on the community index's vocabulary — the host, coverage,
# method, licence and status kinds a listing carries — so the Studio's
# TypeScript names them from these definitions rather than a second copy.
wajiha = ["dep:specta", "taarib-usus/wajiha", "taarib-mustalahat/wajiha"]

[dependencies]
specta = { workspace = true, optional = true }
taarib-usus = { workspace = true }
taarib-mustalahat = { workspace = true }
taarib-ruqaa = { workspace = true }
taarib-tarqee = { workspace = true }
taarib-aman = { workspace = true }
taarib-tathbeet = { workspace = true }
taarib-khatm = { workspace = true }
# `taarib-makhzan` is deliberately NOT a dependency. The manifest's rollback
# baseline and the local patch library are persisted by the caller; this crate
# takes the cached sequence as a parameter and writes only its own shard cache.
# Shard bodies are served compressed by the transport, so nothing here frames
# zstd itself and `zstd` is not a dependency either.

reqwest = { workspace = true }
blake3 = { workspace = true }
# Signatures travel as hexadecimal: the community index carries the owner's in
# its own document, and the caster writes the signing key's public half beside
# the revocation list's. `uuid` is the caster's alone — a game identity arrives
# on its command line as one.
hex = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Free-disk-space probing before a download commits bytes to its destination.
sysinfo = { workspace = true }

[dev-dependencies]
# The revocation refresh is tested against directory sources on a real
# filesystem — a repository with its list, one without, one serving an older
# list than the machine holds, one serving a tampered one — so that
# "unreachable", "withheld", "replayed" and "forged" are produced by the same
# code that meets them in the field.
tempfile = { workspace = true }
