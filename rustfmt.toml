edition = "2024"
max_width = 100
use_small_heuristics = "Default"
newline_style = "Unix"
tab_spaces = 4
hard_tabs = false
reorder_imports = true
reorder_modules = true
match_block_trailing_comma = true
use_field_init_shorthand = true
use_try_shorthand = true
remove_nested_parens = true
merge_derives = true
force_explicit_abi = true

# Everything below is a nightly-only rustfmt option and is therefore NOT set
# here: on stable, an unrecognised key makes rustfmt emit a warning on every
# invocation, and a warning nobody can act on is a warning everybody learns to
# ignore. Run `cargo +nightly fmt` with these in a local override if you want
# them; the tree is written to satisfy them either way.
#
#   imports_granularity = "Module"
#   group_imports = "StdExternalCrate"
#   comment_width = 96
#   wrap_comments = true
#   format_code_in_doc_comments = true
#   condense_wildcard_suffixes = true
#
# One of them would actively damage the source if it were enabled: with
# `wrap_comments = true`, rustfmt rewraps the markdown tables in the crate-level
# documentation and breaks them into unreadable fragments, because a table row
# is prose to it. The tables stay, and their rows are allowed past `max_width`.
